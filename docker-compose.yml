services:
  gluetun:
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8000:8000"  # Gluetun control server
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-}
      - HTTP_CONTROL_SERVER_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/v1/vpn/status"]
      interval: 10s
      timeout: 5s
      retries: 3

  instscraper:
    build: ./packages/instscraper
    network_mode: service:gluetun
    environment:
      - GLUETUN_CONTROL_URL=http://localhost:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
    volumes:
      - scraper-cache:/app/cache
    depends_on:
      gluetun:
        condition: service_healthy

  ttscraper:
    build: ./packages/ttscraper
    network_mode: service:gluetun
    environment:
      - GLUETUN_CONTROL_URL=http://localhost:8000
      - GLUETUN_API_KEY=${GLUETUN_API_KEY:-secret-key}
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
    volumes:
      - scraper-cache:/app/cache
    depends_on:
      gluetun:
        condition: service_healthy

  gateway:
    build: ./packages/gateway
    ports:
      - "8080:8080"
    volumes:
      - scraper-cache:/app/cache
      - ./config:/app/config:ro
    environment:
      - SCRAPER_CONFIG=/app/config/scrapers.yaml
      - CACHE_PATH=/app/cache
      - CACHE_MAX_SIZE_GB=${CACHE_MAX_SIZE_GB:-10.0}
    depends_on:
      - instscraper
      - ttscraper

volumes:
  scraper-cache:
